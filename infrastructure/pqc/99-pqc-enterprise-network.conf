# 1. Google BBR + FQ (Essencial para TLS 1.3 PQC)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. Expansão de Buffers UDP/TCP para 32 MB (QUIC, HTTP/3 e Handshakes PQC)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# 3. Descoberta Inteligente de MTU (Evita Blackholes em Handshakes PQC > 1500 bytes)
net.ipv4.tcp_mtu_probing = 1

# 4. Filas de Handshake e Resiliência SYN
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1

# 5. Hardening de Rede do Kernel (Anti-Spoofing e Anti-Redirects)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# 6. Hardening do Kernel contra Container Escape e Escalação de Privilégio (LPE)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0
fs.inotify.max_user_instances = 2048
