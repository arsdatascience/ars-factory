# ========================================================
# PQC ENTERPRISE SSH HARDENING - SERVIDOR EVEO
# ========================================================
Port 2247

# 1. Troca de Chaves Híbrida Pós-Quântica (Shor-Resistant)
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

# 2. Cifras Simétricas Exclusivas de 256 bits (Grover-Resistant)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr

# 3. MACs de Alta Integridade Encrypt-then-MAC
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# 4. Chaves de Host e Assinaturas Aceitas
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512
PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512

# 5. Restrição de Usuários e Hardening de Sessão
AllowUsers securityroot
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 5
ClientAliveInterval 300
ClientAliveCountMax 2
