services:
  ars-factory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ars-factory-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - PORT=4001
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://factory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/factory
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:?Set API_SECRET_TOKEN in .env}
      - METRICS_SECRET_TOKEN=${METRICS_SECRET_TOKEN:-}
      - FACTORY_DEMO_MODE=${FACTORY_DEMO_MODE:-false}
      - FACTORY_RUN_MIGRATIONS=true
      - FACTORY_MIGRATION_HOSTS=postgres
      - SERVICE_NAME=ars-factory
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ars-network

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_DB: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - factory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "factory", "-d", "factory"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ars-network

volumes:
  factory-postgres-data:

networks:
  ars-network:
    driver: bridge

